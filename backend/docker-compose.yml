services:
  postgres:
    image: postgres:16-alpine
    container_name: sonointeligente-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass12345
      POSTGRES_DB: sonointeligente_db
    #volumes:
    #- postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

#volumes:
#postgres_data:
